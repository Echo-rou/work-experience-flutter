name: work_experience_library
description: A local-first, cross-platform work experience knowledge base.
publish_to: none
version: 1.2.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  http: ^1.5.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  flutter_markdown_plus: 1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pwa/index.html
    - assets/pwa/manifest.webmanifest
    - assets/pwa/pwa-icon.png
    - assets/pwa/sw.js
